name: Release deployables

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows-standalone:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build standalone bundle
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          scripts/build-windows-standalone.sh

      - uses: actions/upload-artifact@v4
        with:
          name: windows-standalone
          path: dist/absence-dashboard-windows.zip

  publish-release:
    needs: [build-windows-standalone]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-standalone
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: "Build ${{ github.sha }}"
          files: release-assets/*
          make_latest: true
